<!DOCTYPE html>
<html lang="en" class="i18n-pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title data-i18n="meta.title">Family Portal (Demo) — Cornerstone Christian Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/portal.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="crest" viewBox="0 0 44 52">
<path d="M3 4 H41 V22 C41 36 32 45 22 50 C12 45 3 36 3 22 Z" fill="#111113" stroke="#E3C46E" stroke-width="1.8"/>
<g fill="#E3C46E"><rect x="20.2" y="9" width="3.6" height="33"/><rect x="11" y="17.2" width="22" height="3.6"/>
<circle cx="22" cy="8.6" r="2.6"/><circle cx="19.6" cy="11" r="1.7"/><circle cx="24.4" cy="11" r="1.7"/>
<circle cx="10.6" cy="19" r="2.6"/><circle cx="13" cy="16.6" r="1.7"/><circle cx="13" cy="21.4" r="1.7"/>
<circle cx="33.4" cy="19" r="2.6"/><circle cx="31" cy="16.6" r="1.7"/><circle cx="31" cy="21.4" r="1.7"/>
<circle cx="22" cy="42.4" r="2.6"/><circle cx="19.6" cy="40" r="1.7"/><circle cx="24.4" cy="40" r="1.7"/></g>
</symbol></defs></svg>
<!-- LOGIN -->
<main class="login open" id="login">
<div class="login-card">
<div class="img" style="background-image:url(../img/2.jpg)"><div data-i18n="login.quote">“Families are not visitors here; they are essential.”</div></div>
<div class="f">
<label class="lang-pick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9s1.3-6.4 3.8-9z"/></svg><select class="lang" data-i18n-aria="lang.label" aria-label="Language" onchange="I18N.set(this.value)"><option value="en">English</option><option value="ko">한국어</option><option value="zh">中文</option><option value="es">Español</option></select></label>
<div class="eyebrow" data-i18n="login.eyebrow">Family Portal · Demo</div>
<h2 data-i18n="login.title">Welcome home.</h2>
<p style="color:var(--muted);font-size:14px;line-height:1.7" data-i18n="login.lead">Preview the portal as a parent or a teacher. Switch roles anytime to see how messages and requests flow between them.</p>
<button class="role" onclick="enter('parent')"><div class="av">KF</div><div><b data-i18n="login.parent">Continue as Parent</b><small data-i18n="login.parentSub">The Kim Family · Grace, Grade 10</small></div></button>
<button class="role" onclick="enter('teacher')"><div class="av" style="background:var(--navy);color:#fff">ST</div><div><b data-i18n="login.teacher">Continue as Teacher / Staff</b><small data-i18n="login.teacherSub">Mrs. Sarah Taylor · Upper School</small></div></button>
<a href="../" style="margin-top:22px;font-size:12px;color:var(--muted)" data-i18n="login.back">← Back to website</a>
</div>
</div>
</main>
<!-- PORTAL -->
<div class="portal" id="portal">
<aside class="p-side">
<a class="brand" href="../"><svg><use href="#crest"/></svg><span><b>Cornerstone</b><small data-i18n="brand.portal">Family Portal</small></span></a>
<nav class="p-nav" id="pnav" aria-label="Portal"></nav>
<div class="p-me"><div class="av" id="meAv">KF</div><div><b id="meName">The Kim Family</b><small id="meRole">Parent</small></div>
<button title="Switch role" data-i18n-aria="top.switch" onclick="switchRole()" style="color:var(--gold2)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg></button></div>
</aside>
<main class="p-main" id="pmain">
<header class="p-top">
<h1 id="ptitle">Home</h1>
<div class="r"><span class="demo" data-i18n="top.demo">Demo data</span><label class="lang-pick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9s1.3-6.4 3.8-9z"/></svg><select class="lang" data-i18n-aria="lang.label" aria-label="Language" onchange="I18N.set(this.value)"><option value="en">English</option><option value="ko">한국어</option><option value="zh">中文</option><option value="es">Español</option></select></label><button class="sbtn sw" onclick="switchRole()" data-i18n="top.switch">Switch role</button><button class="sbtn pri" onclick="exitPortal()" data-i18n="top.exit">Exit</button></div>
</header>
<div class="p-body" id="pbody"></div>
</main>
<nav class="mtab" id="mtab" aria-label="Portal"></nav>
</div>
<!-- DOC MODAL -->
<div class="modal" id="docModal" role="dialog" aria-modal="true" aria-label="Document" onclick="if(event.target===this)closeModal()">
<div style="position:relative;width:min(780px,100%);margin-top:52px">
<div class="doc" id="doc"></div>
</div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../js/common.js"></script>
<script src="../js/portal/i18n.js"></script>
<script src="../js/portal/demo.js"></script>
</body>
</html>
