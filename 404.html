<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- GitHub Pages serves this file for any missing path, at any depth, so relative
     links need a base: the first path segment on github.io (/cornerstone/), else /. -->
<script>document.write('<base href="'+(location.hostname.endsWith('github.io')?'/'+location.pathname.split('/')[1]+'/':'/')+'">')</script>
<title data-i18n="nf.title">Page not found — Cornerstone Christian Academy</title>
<script>/* hide text until a non-English dictionary is applied (no flash of English) */try{var l=localStorage.getItem('cca.lang')||localStorage.getItem('cca.portal.lang');if(!l){var n=(navigator.languages||[navigator.language||'en']).map(function(x){return String(x).slice(0,2).toLowerCase()}).filter(function(x){return/^(en|ko|zh|es)$/.test(x)});l=n[0]||'en'}if(l!=='en'){document.documentElement.className+=' i18n-pending';setTimeout(function(){document.documentElement.classList.remove('i18n-pending')},2500)}}catch(e){}</script>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<div id="layout-top"></div><script src="js/layout.js"></script><script>Layout.top()</script>
<main id="main" tabindex="-1">
<section class="phero nf">
<div class="img" style="background-image:url(img/8.jpg)" aria-hidden="true"></div>
<div class="wrap">
<div class="eyebrow">404</div>
<h1 class="d" data-i18n="nf.h" style="margin-top:12px">This page isn’t here.</h1>
<p data-i18n="nf.p">The link may be old, or the page may have moved. Let’s get you back on the path.</p>
<div class="cta" style="justify-content:flex-start;margin-top:34px"><a class="btn w" href="./" data-i18n="nf.home">Back to home</a><a class="btn o" href="admissions/" data-i18n="m.admissions">Admissions</a></div>
</div>
</section>
</main>
<div id="layout-bottom"></div><script>Layout.bottom()</script>
<script src="js/common.js"></script>
<script src="js/i18n.js" data-dict="js/i18n/"></script>
<script src="js/site.js"></script>
<script>I18N.init()</script>
</body>
</html>
